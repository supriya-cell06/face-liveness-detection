<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - Liveness Detection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="brand-header">
        <div>Liveness<span>Pro</span></div>
        <select id="langSelect" class="lang-select">
            <option value="en">English</option>
            <option value="hi">हिंदी (Hindi)</option>
            <option value="kn">ಕನ್ನಡ (Kannada)</option>
            <option value="ta">தமிழ் (Tamil)</option>
            <option value="te">తెలుగు (Telugu)</option>
            <option value="ml">മലയാളം (Malayalam)</option>
        </select>
    </div>
    <div class="container">
        <!-- Login Form -->
        <div class="card" id="loginCard">
            <h1 data-i18n="welcome_back">Welcome Back</h1>
            <p class="subtitle" data-i18n="subtitle_login">Secure Liveness Detection System</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail" data-i18n="email_label">Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword" data-i18n="password_label">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <div id="loginError" class="form-error hidden"></div>
                <button type="submit" class="btn" data-i18n="login_btn">Log In</button>
            </form>
            
            <div class="toggle-form">
                <span data-i18n="no_account">Don't have an account?</span> <span id="showRegisterBtn" data-i18n="register_here">Register here</span>
            </div>
        </div>

        <!-- Registration Form -->
        <div class="card hidden" id="registerCard">
            <h1 data-i18n="create_account">Create Account</h1>
            <p class="subtitle" data-i18n="subtitle_register">Join our secure platform</p>
            
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName" data-i18n="name_label">Full Name</label>
                    <input type="text" id="regName" required placeholder="John Doe" data-i18n-placeholder="name_placeholder">
                </div>
                <div class="form-group">
                    <label for="regEmail" data-i18n="email_label">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="regPassword" data-i18n="password_label">Password</label>
                    <input type="password" id="regPassword" required placeholder="••••••••" minlength="6">
                </div>
                <div id="regError" class="form-error hidden"></div>
                <button type="submit" class="btn" data-i18n="register_btn">Register</button>
            </form>
            
            <div class="toggle-form">
                <span data-i18n="have_account">Already have an account?</span> <span id="showLoginBtn" data-i18n="login_here">Log in here</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="i18n.js"></script>
    <script defer src="script.js"></script>
</body>
</html>
